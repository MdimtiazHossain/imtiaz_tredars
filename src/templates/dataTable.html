<div style="border:1px solid #E3E0DA;border-radius:8px;background:#fff;overflow:hidden">
  <div class="dt-scroll" style="max-height:{{ t.maxH }};overflow:auto">
    <table style="width:100%;border-collapse:collapse;font-size:13px;color:#1A1817">
      <thead>
        <tr>
          <sc-if value="{{ t.selectable }}">
            <th style="position:sticky;top:0;z-index:1;background:#FAF9F7;border-bottom:1px solid #E3E0DA;padding:{{ t.headPadY }} 14px;width:1%">
              <input type="checkbox" checked="{{ t.allSelected }}" onChange="{{ t.onSelectAll }}" aria-label="Select all rows" style="cursor:pointer" />
            </th>
          </sc-if>
          <sc-for list="{{ t.cols }}" as="c" hint-placeholder-count="6">
            <th onClick="{{ c.onClick }}" style="position:sticky;top:0;z-index:1;background:#FAF9F7;border-bottom:1px solid #E3E0DA;padding:{{ t.headPadY }} 14px;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#6E6A64;white-space:nowrap;text-align:{{ c.align }};cursor:{{ c.cursor }}">{{ c.label }}{{ c.sortMark }}</th>
          </sc-for>
        </tr>
      </thead>
      <tbody>
        <sc-for list="{{ t.rows }}" as="r" hint-placeholder-count="6">
          <tr onClick="{{ r.onClick }}" style="background:{{ r.bg }};cursor:{{ r.cursor }};border-bottom:1px solid #F0EEE9" style-hover="background:#FAF9F7">
            <sc-if value="{{ r.selectable }}">
              <td style="padding:{{ t.padY }} 14px;vertical-align:middle;width:1%">
                <input type="checkbox" checked="{{ r.selected }}" onChange="{{ r.onSelect }}" aria-label="Select row" style="cursor:pointer" />
              </td>
            </sc-if>
            <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="6">
              <td style="padding:{{ t.padY }} 14px;vertical-align:middle;text-align:{{ c.align }};white-space:nowrap">
                <div style="display:flex;align-items:center;gap:7px;justify-content:{{ c.just }}">
                  <sc-if value="{{ c.dot }}">
                    <span style="width:7px;height:7px;border-radius:50%;flex:none;background:{{ c.dot }}"></span>
                  </sc-if>
                  <sc-if value="{{ c.badge }}">
                    <span style="display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;background:{{ c.badgeBg }};color:{{ c.badgeFg }}">{{ c.text }}</span>
                  </sc-if>
                  <sc-if value="{{ c.plain }}" hint-placeholder-val="{{ true }}">
                    <span style="font-family:{{ c.font }};font-weight:{{ c.weight }};color:{{ c.color }};font-size:{{ c.size }}">{{ c.text }}</span>
                  </sc-if>
                  <sc-if value="{{ c.hasActions }}">
                    <sc-for list="{{ c.actions }}" as="a" hint-placeholder-count="2">
                      <button onClick="{{ a.onClick }}" style="border:1px solid #E3E0DA;background:#fff;border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:600;cursor:pointer;color:{{ a.color }}" style-hover="border-color:{{ a.hoverColor }};color:{{ a.hoverColor }}">{{ a.label }}</button>
                    </sc-for>
                  </sc-if>
                </div>
                <sc-if value="{{ c.sub }}">
                  <div style="margin-top:3px;font-size:11px;color:#8C877F;text-align:{{ c.align }}">{{ c.sub }}</div>
                </sc-if>
              </td>
            </sc-for>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </div>
  <sc-if value="{{ t.isEmpty }}">
    <div style="padding:56px 24px;text-align:center">
      <div style="width:44px;height:44px;margin:0 auto 14px;border-radius:10px;border:1px dashed #D6D1C8;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#B6B0A6" stroke-width="1.3"><path d="M2 4.5h12M2 8h12M2 11.5h7"></path></svg>
      </div>
      <div style="font-size:14px;font-weight:600;color:#3D3A36">{{ t.emptyTitle }}</div>
      <div style="margin-top:5px;font-size:12.5px;color:#8C877F">{{ t.emptyNote }}</div>
    </div>
  </sc-if>
  <sc-if value="{{ t.pager }}">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-top:1px solid #E3E0DA;background:#FAF9F7;font-size:12px;color:#6E6A64">
      <span>{{ t.pager.label }}</span>
      <span style="display:flex;gap:6px">
        <button onClick="{{ t.pager.onPrev }}" style="border:1px solid #E3E0DA;background:#fff;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;color:{{ t.pager.prevColor }}" style-hover="background:#F1EFEA">Previous</button>
        <button onClick="{{ t.pager.onNext }}" style="border:1px solid #E3E0DA;background:#fff;border-radius:6px;padding:5px 11px;font-size:12px;cursor:pointer;color:{{ t.pager.nextColor }}" style-hover="background:#F1EFEA">Next</button>
      </span>
    </div>
  </sc-if>
  <sc-if value="{{ t.footNote }}">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #E3E0DA;background:#FAF9F7;font-size:12px;color:#6E6A64">
      <span>{{ t.footNote }}</span>
      <span style="font-family:'Roboto Mono',monospace;color:#3D3A36">{{ t.footTotal }}</span>
    </div>
  </sc-if>
</div>
