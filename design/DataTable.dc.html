<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="border:1px solid #E3E0DA;border-radius:8px;background:#fff;overflow:hidden">
  <div style="max-height:{{ t.maxH }};overflow:auto">
    <table style="width:100%;border-collapse:collapse;font-size:13px;color:#1A1817">
      <thead>
        <tr>
          <sc-for list="{{ t.cols }}" as="c" hint-placeholder-count="6">
            <th onClick="{{ c.onClick }}" style="position:sticky;top:0;z-index:1;background:#FAF9F7;border-bottom:1px solid #E3E0DA;padding:10px 14px;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:#6E6A64;white-space:nowrap;text-align:{{ c.align }};cursor:{{ c.cursor }}">{{ c.label }}{{ c.sortMark }}</th>
          </sc-for>
        </tr>
      </thead>
      <tbody>
        <sc-for list="{{ t.rows }}" as="r" hint-placeholder-count="6">
          <tr onClick="{{ r.onClick }}" style="background:{{ r.bg }};cursor:{{ r.cursor }};border-bottom:1px solid #F0EEE9" style-hover="background:#FAF9F7">
            <sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="6">
              <td style="padding:11px 14px;vertical-align:middle;text-align:{{ c.align }};white-space:nowrap">
                <div style="display:flex;align-items:center;gap:7px;justify-content:{{ c.just }}">
                  <sc-if value="{{ c.dot }}">
                    <span style="width:7px;height:7px;border-radius:50%;flex:none;background:{{ c.dot }}"></span>
                  </sc-if>
                  <sc-if value="{{ c.badge }}">
                    <span style="display:inline-block;padding:3px 8px;border-radius:5px;font-size:11px;font-weight:600;background:{{ c.badgeBg }};color:{{ c.badgeFg }}">{{ c.text }}</span>
                  </sc-if>
                  <sc-if value="{{ c.plain }}" hint-placeholder-val="{{ true }}">
                    <span style="font-family:{{ c.font }};font-weight:{{ c.weight }};color:{{ c.color }};font-size:{{ c.size }}">{{ c.text }}</span>
                  </sc-if>
                </div>
                <sc-if value="{{ c.sub }}">
                  <div style="margin-top:3px;font-size:11px;color:#8C877F;text-align:{{ c.align }}">{{ c.sub }}</div>
                </sc-if>
              </td>
            </sc-for>
          </tr>
        </sc-for>
      </tbody>
    </table>
  </div>
  <sc-if value="{{ t.isEmpty }}">
    <div style="padding:56px 24px;text-align:center">
      <div style="width:44px;height:44px;margin:0 auto 14px;border-radius:10px;border:1px dashed #D6D1C8;display:flex;align-items:center;justify-content:center">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="#B6B0A6" stroke-width="1.3"><path d="M2 4.5h12M2 8h12M2 11.5h7"></path></svg>
      </div>
      <div style="font-size:14px;font-weight:600;color:#3D3A36">{{ t.emptyTitle }}</div>
      <div style="margin-top:5px;font-size:12.5px;color:#8C877F">{{ t.emptyNote }}</div>
    </div>
  </sc-if>
  <sc-if value="{{ t.footNote }}">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid #E3E0DA;background:#FAF9F7;font-size:12px;color:#6E6A64">
      <span>{{ t.footNote }}</span>
      <span style="font-family:'Roboto Mono',monospace;color:#3D3A36">{{ t.footTotal }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:320},&quot;t&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{cols:Col[];rows:Row[];isEmpty?:boolean;emptyTitle?:string;emptyNote?:string;footNote?:string;footTotal?:string;maxH?:string}&quot;}}"></script>
</body>
</html>
